<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Змейка</title>
<style>

:root{
--text:#ecf7ff;
--mint:#71ffb3}
*{
box-sizing:border-box}
body{
margin:0;
min-height:100vh;
display:grid;
place-items:center;
background:radial-gradient(circle at 50% 0,#305676,#061018 67%);
font-family:system-ui,sans-serif;
color:var(--text)}
main{
width:min(94vw,780px);
padding:18px;
border:1px solid #6285a055;
border-radius:24px;
background:linear-gradient(140deg,#193142dd,#071018ee);
box-shadow:0 28px 90px #000b;
text-align:center}
h1{
font-size:clamp(1.45rem,4vw,2.2rem);
letter-spacing:.12em;
margin:2px 0 8px}
.sub{
margin:0 0 14px;
color:#b7d0df;
font-size:.9rem}
.stats{
display:flex;
justify-content:center;
gap:min(11vw,100px);
margin:0 0 14px}
.stats b{
display:block;
color:var(--mint);
font-size:1.4rem}
canvas{
display:block;
width:100%;
aspect-ratio:1.5;
border-radius:16px;
background:#89c7e9;
box-shadow:inset 0 0 0 2px #9cdaf244}
.below{
display:flex;
justify-content:space-between;
align-items:center;
margin:12px 3px 5px;
color:#b7d0df;
font-size:.9rem}
.controls{
display:grid;
grid-template-columns:repeat(3,62px);
justify-content:center;
gap:6px;
margin-top:10px}
button{
border:1px solid #a6d9eb33;
border-radius:12px;
background:#294a5e;
color:#fff;
font-size:1.25rem;
padding:10px;
cursor:pointer;
touch-action:manipulation}
button:hover,button:active{
background:#41728b}
.up{
grid-column:2}
.left{
grid-column:1;
grid-row:2}
.down{
grid-column:2;
grid-row:2}
.right{
grid-column:3;
grid-row:2}
#restart{
font-size:.95rem;
background:#24774c;
padding:9px 14px}
@media(max-width:450px){
main{
padding:12px}
.controls{
grid-template-columns:repeat(3,57px)}
}
</style>
</head>
<body>
<main>
<h1>3D ЗМЕЙКА</h1>
<p class="sub">Большая карта · 40 × 40 клеток</p>
<div class="stats">
<span>СЧЁТ<b id="score">0</b>
</span>
<span>РЕКОРД<b id="best">0</b>
</span>
</div>
<canvas id="game" width="900" height="600">
</canvas>
<div class="below">
<span id="message">Стрелки или WASD — движение</span>
<button id="restart">Новая игра</button>
</div>
<div class="controls">
<button class="up" data-d="up">▲</button>
<button class="left" data-d="left">◀</button>
<button class="down" data-d="down">▼</button>
<button class="right" data-d="right">▶</button>
</div>
</main>
<script>

const C=document.querySelector('#game'),X=C.getContext('2d'),N=40,scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),msg=document.querySelector('#message');
let snake,food,dir,next,score,best=+localStorage.snake3dBest||0,timer;
bestEl.textContent=best;
const H=118,CX=450,SCALE=18;
const decor=[['tree',3,33],['tree',9,28],['rock',15,35],['bush',26,33],['tree',34,29],['rock',5,21],['bush',12,17],['tree',31,19],['rock',36,13],['tree',6,8],['bush',23,7],['rock',17,4],['tree',35,3]];

function p(x,y,z=0){let d=1+(N-y)*.035;
return{x:CX+(x-N/2)*SCALE/d,y:H+y*11.25/d-z*25/d,s:SCALE/d}}

function poly(a,c){X.fillStyle=c;
X.beginPath();
X.moveTo(a[0].x,a[0].y);
a.slice(1).forEach(q=>X.lineTo(q.x,q.y));
X.closePath();
X.fill()}

function shade(h,n){let v=parseInt(h.slice(1),16),r=Math.max(0,Math.min(255,(v>>16)+n)),g=Math.max(0,Math.min(255,((v>>8)&255)+n)),b=Math.max(0,Math.min(255,(v&255)+n));
return`rgb(${r},${g},${b})`}

function cube(x,y,z,col){let a=p(x,y,z),b=p(x+1,y,z),c=p(x+1,y+1,z),d=p(x,y+1,z),A=p(x,y,z+1),B=p(x+1,y,z+1),D=p(x,y+1,z+1),E=p(x+1,y+1,z+1);
poly([d,c,E,D],'#143a3f88');
poly([b,c,E,B],shade(col,-30));
poly([A,B,E,D],col)}

function plant(kind,x,y){let q=p(x+.5,y+.5),r=q.s;
if(kind==='rock'){X.fillStyle='#162b3455';
X.beginPath();
X.ellipse(q.x,q.y+r*.28,r*.56,r*.17,0,0,7);
X.fill();
X.fillStyle='#8b9a9d';
X.beginPath();
X.ellipse(q.x,q.y-r*.08,r*.42,r*.31,0,0,7);
X.fill();
return}if(kind==='bush'){X.fillStyle='#16472d';
for(let n=-1;
n<2;
n++){X.beginPath();
X.arc(q.x+n*r*.27,q.y-r*.2,r*.31,0,0,7);
X.fill()}return}X.fillStyle='#573b24';
X.fillRect(q.x-r*.09,q.y-r*1.12,r*.18,r*1.15);
for(let n=0;
n<3;
n++){let yy=q.y-r*(.72+n*.23),rr=r*(.6-n*.11);
X.fillStyle=n===2?'#5bc967':'#287d45';
X.beginPath();
X.moveTo(q.x,yy-r*.55);
X.lineTo(q.x-rr,yy+r*.32);
X.lineTo(q.x+rr,yy+r*.32);
X.closePath();
X.fill()}}

function sphere(x,y,isHead=false){let q=p(x+.5,y+.5,.42),r=q.s*(isHead?.56:.48);
X.fillStyle='#102a3155';
X.beginPath();
X.ellipse(q.x,q.y+r*.75,r*1.1,r*.3,0,0,7);
X.fill();
let g=X.createRadialGradient(q.x-r*.32,q.y-r*.48,r*.04,q.x,q.y,r);
g.addColorStop(0,isHead?'#e4ffd3':'#b4ffc2');
g.addColorStop(.36,isHead?'#79ed92':'#47ca74');
g.addColorStop(1,'#167148');
X.fillStyle=g;
X.beginPath();
X.ellipse(q.x,q.y,r,r*.8,0,0,7);
X.fill();
return{q,r}}

function dot(x,y){let q=p(x+.5,y+.5,.35);
X.fillStyle='#11232b55';
X.beginPath();
X.ellipse(q.x,q.y+q.s*.32,q.s*.6,q.s*.16,0,0,7);
X.fill();
X.fillStyle='#ff475d';
X.beginPath();
X.arc(q.x,q.y-q.s*.22,q.s*.32,0,7);
X.fill();
X.fillStyle='#fff9';
X.beginPath();
X.arc(q.x-q.s*.1,q.y-q.s*.33,q.s*.08,0,7);
X.fill()}
function draw(){let sky=X.createLinearGradient(0,0,0,H+45);
sky.addColorStop(0,'#75bfe9');
sky.addColorStop(1,'#d3f1ea');
X.fillStyle=sky;
X.fillRect(0,0,C.width,C.height);
X.fillStyle='#eaf9e7';
X.fillRect(0,H,C.width,C.height);
for(let y=N-1;
y>=0;
y--)for(let x=0;
x<N;
x++){let a=p(x,y),b=p(x+1,y),c=p(x+1,y+1),d=p(x,y+1);
poly([a,b,c,d],(x+y)%2?'#2f8656':'#358f5c')}for(let x=0;
x<N;
x++)cube(x,N-1,0,'#49646a');
for(let y=0;
y<N;
y++){cube(-.45,y,0,'#49646a');
cube(N-.55,y,0,'#49646a')}decor.slice().sort((a,b)=>b[2]-a[2]).forEach(d=>plant(...d));
dot(food.x,food.y);
snake.slice(1).reverse().forEach(s=>sphere(s.x,s.y));
let h=snake[0],head=sphere(h.x,h.y,true),forward=p(h.x+.5+dir.x*.35,h.y+.5+dir.y*.35,.42),dx=forward.x-head.q.x,dy=forward.y-head.q.y,len=Math.hypot(dx,dy)||1,sideX=-dy/len,sideY=dx/len;
for(let side of[-1,1]){let ex=head.q.x+dx*.24+sideX*head.r*.3*side,ey=head.q.y+dy*.24+sideY*head.r*.22*side;
X.fillStyle='#092f25';
X.beginPath();
X.arc(ex,ey,head.r*.12,0,7);
X.fill();
X.fillStyle='#fff';
X.beginPath();
X.arc(ex-dx*.045,ey-dy*.045,head.r*.035,0,7);
X.fill()}}
function spawn(){let f;
do{f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===f.x&&s.y===f.y));
return f}

function reset(){clearInterval(timer);
snake=[{x:20,y:20},{x:19,y:20},{x:18,y:20},{x:17,y:20}];
dir=next={x:1,y:0};
food=spawn();
score=0;
scoreEl.textContent=0;
msg.textContent='Стрелки или WASD — движение';
draw();
timer=setInterval(step,105)}

function step(){dir=next;
let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){clearInterval(timer);
msg.textContent='Столкновение! Нажми «Новая игра».';
draw();
return}snake.unshift(h);
if(h.x===food.x&&h.y===food.y){score++;
scoreEl.textContent=score;
if(score>best){best=score;
localStorage.snake3dBest=best;
bestEl.textContent=best}food=spawn()}else snake.pop();
draw()}

function move(k){let m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[k];
if(m&&!(m.x===-dir.x&&m.y===-dir.y))next=m}

addEventListener('keydown',e=>{let k={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'}[e.key];
if(k){e.preventDefault();
move(k)}});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));
document.querySelector('#restart').onclick=reset;
reset();


</script>
</body>
</html>
