<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090708">
  <title>RAMPAGE</title>
  <style>
    :root{color-scheme:dark;--red:#ff4545;--ink:#f7f4f1;--muted:#aaa3a3}
    *{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;padding:20px;display:grid;place-items:center;overflow:hidden;color:var(--ink);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 50% 12%,#501717 0,transparent 42%),radial-gradient(ellipse at 86% 90%,#2b1015 0,transparent 40%),#090708}
    .container{position:relative;isolation:isolate;width:min(94vw,970px);padding:27px 40px 30px;text-align:center;overflow:hidden;background:linear-gradient(145deg,#171313ef,#100e0ff5);border:1px solid #ffffff19;border-radius:26px;box-shadow:0 28px 100px #000a,0 0 70px #ff393915}
    .topline{display:flex;justify-content:space-between;align-items:center;color:#837879;font:9px ui-monospace,monospace;letter-spacing:.16em}.signal{display:inline-flex;align-items:center;gap:8px;color:#d6bebe}.signal i{width:6px;height:6px;border-radius:50%;background:#ff6a58;box-shadow:0 0 12px #ff483f;animation:pulse 1.8s infinite}
    .stage{position:relative;height:250px;margin:5px auto 0;display:grid;place-items:center;perspective:1000px}.world{position:relative;width:230px;height:230px;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out}.aura{position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle,#ff282855 0,#ff242422 42%,transparent 71%);filter:blur(23px);animation:glow 4.5s ease-in-out infinite alternate}
    .orb{position:absolute;inset:23%;border-radius:50%;background:radial-gradient(ellipse at 31% 25%,#ffe3c1 0%,#ff9b64 3%,#ff4040 10%,#b51728 29%,#521120 53%,#1b111a 76%);box-shadow:inset -18px -14px 28px #080709,inset 7px 6px 20px #ffdbbb8a,0 0 30px #ff493d83,0 0 78px #ff252752,0 0 130px #c91b302b;animation:float 6s ease-in-out infinite}
    .orb:before{content:"";position:absolute;inset:-2%;border-radius:50%;background:repeating-radial-gradient(ellipse at 38% 36%,transparent 0 8px,#ffd6c32b 9px 10px,transparent 11px 17px);mask-image:radial-gradient(ellipse,transparent 30%,#000 35%,#000 72%,transparent 77%);animation:spin 27s linear infinite}.orb:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(125deg,transparent 29%,#fff0da40 40%,transparent 49%),radial-gradient(ellipse at 28% 19%,#fff6e945,transparent 27%);mix-blend-mode:screen}
    .orbit{position:absolute;left:50%;top:50%;border:1px solid #ffb4a55c;border-radius:50%;transform-style:preserve-3d}.orbit.a{width:120%;height:43%;transform:translate(-50%,-50%) rotate(-24deg) rotateX(67deg);animation:orbitA 15s linear infinite}.orbit.b{width:70%;height:125%;border-color:#ff564d69;transform:translate(-50%,-50%) rotate(50deg) rotateY(68deg);animation:orbitB 22s linear infinite}.orbit.c{width:128%;height:47%;border-color:#ffd1bd46;transform:translate(-50%,-50%) rotate(26deg) rotateX(72deg);animation:orbitC 19s linear infinite}.satellite{position:absolute;left:8%;top:45%;width:8px;height:8px;border-radius:50%;background:#ffe3bc;box-shadow:0 0 9px #ffb07c,0 0 22px #ff423d}.orbit.b .satellite{left:88%;top:24%;width:5px;height:5px;background:#fff0df;box-shadow:0 0 10px white,0 0 22px #ff6f54}
    .spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff2e4;box-shadow:0 0 9px 2px #ff6d59;animation:twinkle 2s ease-in-out infinite alternate}.sp1{left:7%;top:25%}.sp2{right:8%;top:35%;animation-delay:.4s}.sp3{right:17%;bottom:14%;animation-delay:1.1s}.sp4{left:14%;bottom:17%;animation-delay:.8s}.sp5{left:51%;top:2%;animation-delay:1.5s}.shock{position:absolute;left:50%;top:50%;width:45%;aspect-ratio:1;border:1px solid #ffb48b;border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.4);box-shadow:0 0 25px #ff5049}.world.burst .shock{animation:shock .95s cubic-bezier(.1,.7,.2,1)}.world.burst .orb{animation:float 6s ease-in-out infinite,flash .8s ease-out}.orb-label{position:absolute;right:0;bottom:15px;color:#a59b9c;text-align:right;font:8px ui-monospace,monospace;letter-spacing:.15em}.orb-label b{display:block;margin-top:6px;color:#ff8f72;font-weight:400}
    .logo{margin:0 0 13px;font-size:clamp(44px,8vw,82px);line-height:1;font-weight:900;letter-spacing:.16em;text-indent:.16em;background:linear-gradient(100deg,#fff4ea,#ff6860 72%,#ffa16c);-webkit-background-clip:text;background-clip:text;color:transparent}.subtitle{color:#b7adad;font-size:17px;margin-bottom:28px}.buttons{display:flex;justify-content:center;gap:13px;flex-wrap:wrap}.button{display:inline-block;padding:13px 25px;border:1px solid transparent;border-radius:11px;background:linear-gradient(100deg,#ff5b51,#e73346);color:white;text-decoration:none;font-weight:bold;font-size:14px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}.button:hover{transform:translateY(-3px);box-shadow:0 10px 30px #ff45453b}.button.secondary{background:#ffffff08;color:#eee4e4;border-color:#ffffff29}.button.secondary:hover{border-color:#ff766b8a}.footer{margin-top:33px;color:#655d60;font:9px ui-monospace,monospace;letter-spacing:.12em}
    @keyframes float{0%,100%{translate:0 -4px}50%{translate:0 7px}}@keyframes spin{to{rotate:360deg}}@keyframes orbitA{to{rotate:360deg}}@keyframes orbitB{to{rotate:-360deg}}@keyframes orbitC{to{rotate:360deg}}@keyframes pulse{50%{opacity:.3}}@keyframes glow{to{transform:scale(1.18);opacity:.68}}@keyframes twinkle{to{opacity:.2;transform:scale(.5)}}@keyframes shock{0%{opacity:.85;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(2)}}@keyframes flash{50%{filter:brightness(1.8);scale:1.05}}
    @media(max-width:600px){body{padding:12px}.container{width:100%;padding:22px 18px;border-radius:20px}.topline{font-size:8px}.stage{height:215px;margin-top:12px}.world{transform:scale(.86) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}.logo{letter-spacing:.1em;text-indent:.1em}.subtitle{font-size:15px;margin-bottom:24px}.footer{margin-top:27px}.orb-label{right:2px;bottom:9px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
  </style>
</head>
<body>
<main class="container">
  <div class="topline"><span>RAMPAGE / 001</span><span class="signal"><i></i> CORE ONLINE</span></div>
  <div class="stage" id="stage" aria-label="Интерактивная трёхмерная анимация"><div class="world" id="world"><div class="aura"></div><div class="orbit a"><i class="satellite"></i></div><div class="orbit b"><i class="satellite"></i></div><div class="orbit c"></div><div class="orb"></div><div class="shock"></div><i class="spark sp1"></i><i class="spark sp2"></i><i class="spark sp3"></i><i class="spark sp4"></i><i class="spark sp5"></i><div class="orb-label">FIELD STATUS<b>STABLE / 98.4%</b></div></div></div>
  <h1 class="logo">RAMPAGE</h1><p class="subtitle">Новый проект. Новая история.</p>
  <div class="buttons"><a href="#" class="button" id="launch">Запустить импульс <span aria-hidden="true">↗</span></a><a href="https://github.com/imfrqte/Rampage" class="button secondary" target="_blank" rel="noopener noreferrer">GitHub</a></div>
  <div class="footer">© 2026 RAMPAGE · MOVE YOUR CURSOR TO FEEL THE FIELD</div>
</main>
<script>
const world=document.querySelector('#world'),stage=document.querySelector('#stage');let px=0,py=0,frame=0;stage.addEventListener('pointermove',e=>{if(matchMedia('(max-width:600px)').matches)return;const r=stage.getBoundingClientRect();px=((e.clientX-r.left-r.width/2)/r.width)*12;py=-((e.clientY-r.top-r.height/2)/r.height)*10;if(!frame)frame=requestAnimationFrame(()=>{world.style.setProperty('--ry',px+'deg');world.style.setProperty('--rx',py+'deg');frame=0})});stage.addEventListener('pointerleave',()=>{world.style.setProperty('--ry','0deg');world.style.setProperty('--rx','0deg')});document.querySelector('#launch').addEventListener('click',e=>{e.preventDefault();world.classList.remove('burst');void world.offsetWidth;world.classList.add('burst');setTimeout(()=>world.classList.remove('burst'),1050)});
</script>
</body>
</html>
